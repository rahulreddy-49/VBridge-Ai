server.port=8080

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/medlit_ai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# AI & LLM Service Configuration
medlit.ai.openai.api-key=${OPENAI_API_KEY:}
medlit.ai.gemini.api-key=${GEMINI_API_KEY:}
medlit.ai.demo-mode=${DEMO_MODE:true}
